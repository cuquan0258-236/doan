<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SOAR — Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Header */
        .top-bar {
            background: linear-gradient(135deg, #1a2332, #243447);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #00d4ff33;
        }
        .top-bar h1 {
            font-size: 22px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar h1 span { font-size: 26px; }
        .top-bar .stats {
            display: flex;
            gap: 24px;
        }
        .stat-box {
            text-align: center;
            padding: 6px 18px;
            background: #0f1923;
            border-radius: 8px;
            border: 1px solid #ffffff15;
        }
        .stat-box .num {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-box .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        .stat-box.high .num { color: #ff4757; }
        .stat-box.medium .num { color: #ffa502; }
        .stat-box.low .num { color: #2ed573; }
        .stat-box.total .num { color: #00d4ff; }

        /* Main */
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        /* Email List */
        .email-list {
            width: 420px;
            background: #141e2b;
            border-right: 1px solid #ffffff10;
            overflow-y: auto;
        }
        .list-header {
            padding: 14px 18px;
            background: #1a2836;
            border-bottom: 1px solid #ffffff10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-header h2 { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .btn-collect {
            padding: 6px 14px;
            background: #00d4ff22;
            color: #00d4ff;
            border: 1px solid #00d4ff44;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-collect:hover { background: #00d4ff44; }
        .btn-collect:disabled { opacity: 0.5; cursor: not-allowed; }

        .email-item {
            padding: 14px 18px;
            border-bottom: 1px solid #ffffff08;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .email-item:hover { background: #1c2a3a; }
        .email-item.active { background: #1c2a3a; border-left: 3px solid #00d4ff; }
        .email-item .risk-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .risk-dot.HIGH { background: #ff4757; box-shadow: 0 0 6px #ff475766; }
        .risk-dot.MEDIUM { background: #ffa502; box-shadow: 0 0 6px #ffa50266; }
        .risk-dot.LOW { background: #2ed573; box-shadow: 0 0 6px #2ed57366; }
        .risk-dot.none { background: #555; }
        .email-item .info { flex: 1; min-width: 0; }
        .email-item .sender {
            font-size: 13px;
            font-weight: 600;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .email-item .subject {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .email-item .meta-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
        }
        .tag.status-collected { background: #00d4ff22; color: #00d4ff; }
        .tag.status-analyzed { background: #2ed57322; color: #2ed573; }
        .tag.status-analyzing { background: #ffa50222; color: #ffa502; }
        .tag.status-error { background: #ff475722; color: #ff4757; }

        /* Detail Panel */
        .detail-panel {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }
        .detail-panel .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            font-size: 16px;
        }

        .detail-header {
            margin-bottom: 24px;
        }
        .detail-header h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }
        .detail-header .detail-meta {
            color: #888;
            font-size: 13px;
        }
        .detail-header .detail-meta span { margin-right: 16px; }

        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: #1a2836;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #ffffff10;
        }
        .card h3 {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Risk Score */
        .risk-display {
            text-align: center;
            padding: 20px;
        }
        .risk-score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 32px;
            font-weight: bold;
        }
        .risk-score-circle.HIGH { background: #ff475722; color: #ff4757; border: 3px solid #ff4757; }
        .risk-score-circle.MEDIUM { background: #ffa50222; color: #ffa502; border: 3px solid #ffa502; }
        .risk-score-circle.LOW { background: #2ed57322; color: #2ed573; border: 3px solid #2ed573; }
        .risk-label {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }
        .risk-label.HIGH { color: #ff4757; }
        .risk-label.MEDIUM { color: #ffa502; }
        .risk-label.LOW { color: #2ed573; }

        /* Auth badges */
        .auth-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .auth-badge {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 14px 10px;
            border-radius: 8px;
            border: 1px solid #ffffff10;
        }
        .auth-badge .protocol { font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 600; }
        .auth-badge .status { font-size: 18px; font-weight: bold; }
        .auth-badge.pass { background: #2ed57312; }
        .auth-badge.pass .status { color: #2ed573; }
        .auth-badge.fail, .auth-badge.softfail { background: #ff475712; }
        .auth-badge.fail .status, .auth-badge.softfail .status { color: #ff4757; }
        .auth-badge.none { background: #ffa50212; }
        .auth-badge.none .status { color: #ffa502; }

        /* Domain info */
        .domain-info { line-height: 2; }
        .domain-info .row { display: flex; justify-content: space-between; border-bottom: 1px solid #ffffff08; }
        .domain-info .label { color: #888; font-size: 13px; }
        .domain-info .value { color: #ddd; font-size: 13px; font-weight: 600; }
        .domain-info .value.suspicious { color: #ff4757; }

        /* Anomalies */
        .anomaly-list { list-style: none; }
        .anomaly-item {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .anomaly-item .icon { font-size: 16px; flex-shrink: 0; }
        .anomaly-item.CRITICAL { background: #ff475718; border-left: 3px solid #ff4757; }
        .anomaly-item.HIGH { background: #ff634718; border-left: 3px solid #ff6347; }
        .anomaly-item.MEDIUM { background: #ffa50218; border-left: 3px solid #ffa502; }

        /* Received chain */
        .hop-item {
            padding: 10px 14px;
            margin-bottom: 6px;
            background: #0f1923;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Consolas', monospace;
            border-left: 2px solid #00d4ff44;
        }
        .hop-item .hop-num { color: #00d4ff; font-weight: bold; margin-bottom: 4px; }
        .hop-item .hop-detail { color: #999; }
        .hop-item .hop-detail span { color: #ddd; }

        /* Buttons */
        .btn-analyze {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff22, #0099cc22);
            color: #00d4ff;
            border: 1px solid #00d4ff44;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            margin-right: 8px;
        }
        .btn-analyze:hover { background: linear-gradient(135deg, #00d4ff44, #0099cc44); }
        .btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-verify {
            padding: 10px 20px;
            background: #2ed57322;
            color: #2ed573;
            border: 1px solid #2ed57344;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-verify:hover { background: #2ed57344; }

        .actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        /* SHA hash */
        .hash-display {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #00d4ff;
            background: #0f1923;
            padding: 10px 14px;
            border-radius: 6px;
            word-break: break-all;
        }
        .verify-result {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .verify-result.INTACT { background: #2ed57322; color: #2ed573; }
        .verify-result.TAMPERED { background: #ff475722; color: #ff4757; }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #555;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* No analysis message */
        .no-analysis {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        .no-analysis p { margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="top-bar">
    <h1><span>🛡️</span> Mini SOAR Dashboard</h1>
    <div class="stats">
        <div class="stat-box total"><div class="num" id="stat-total">-</div><div class="label">Tổng email</div></div>
        <div class="stat-box high"><div class="num" id="stat-high">-</div><div class="label">🔴 High</div></div>
        <div class="stat-box medium"><div class="num" id="stat-medium">-</div><div class="label">🟡 Medium</div></div>
        <div class="stat-box low"><div class="num" id="stat-low">-</div><div class="label">🟢 Low</div></div>
    </div>
</div>

<div class="container">
    <!-- Email List -->
    <div class="email-list">
        <div class="list-header">
            <h2>📥 Inbox</h2>
            <button class="btn-collect" id="btn-collect" onclick="collectEmails()">Thu thập</button>
        </div>
        <div id="email-list-body">
            <div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>
        </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detail-panel">
        <div class="placeholder">← Chọn một email để xem chi tiết phân tích</div>
    </div>
</div>

<script>
const API = 'http://localhost:3000/api';
let emails = [];
let selectedId = null;

// Load email list
async function loadEmails() {
    try {
        const res = await fetch(`${API}/inbox?limit=50`);
        const data = await res.json();
        emails = data.data.emails;
        renderList();
        updateStats();
    } catch (err) {
        document.getElementById('email-list-body').innerHTML =
            '<div class="loading">❌ Không kết nối được server<br><small>Chạy <code>npm start</code> trước</small></div>';
    }
}

function renderList() {
    const container = document.getElementById('email-list-body');
    if (!emails.length) {
        container.innerHTML = '<div class="loading">Chưa có email nào</div>';
        return;
    }
    container.innerHTML = emails.map(e => `
        <div class="email-item ${e._id === selectedId ? 'active' : ''}" onclick="selectEmail('${e._id}')">
            <div class="risk-dot ${e.riskLevel || 'none'}"></div>
            <div class="info">
                <div class="sender">${escHtml(e.sender)}</div>
                <div class="subject">${decodeSubject(e.subject)}</div>
                <div class="meta-row">
                    <span class="tag status-${e.status}">${e.status}</span>
                    ${e.riskLevel ? `<span class="tag" style="background:${riskColor(e.riskLevel)}22;color:${riskColor(e.riskLevel)}">${e.riskLevel} (${e.riskScore})</span>` : ''}
                    <span class="tag" style="background:#ffffff08;color:#666">${formatSize(e.fileSize)}</span>
                </div>
            </div>
        </div>
    `).join('');
}

function updateStats() {
    document.getElementById('stat-total').textContent = emails.length;
    document.getElementById('stat-high').textContent = emails.filter(e => e.riskLevel === 'HIGH').length;
    document.getElementById('stat-medium').textContent = emails.filter(e => e.riskLevel === 'MEDIUM').length;
    document.getElementById('stat-low').textContent = emails.filter(e => e.riskLevel === 'LOW').length;
}

// Select email
async function selectEmail(id) {
    selectedId = id;
    renderList();
    const email = emails.find(e => e._id === id);
    const panel = document.getElementById('detail-panel');

    panel.innerHTML = `
        <div class="detail-header">
            <h2>${decodeSubject(email.subject)}</h2>
            <div class="detail-meta">
                <span>👤 ${escHtml(email.sender)}</span>
                <span>📩 ${escHtml(email.recipient)}</span>
                <span>📅 ${new Date(email.collectedAt).toLocaleString('vi-VN')}</span>
            </div>
        </div>
        <div class="actions-bar">
            <button class="btn-analyze" onclick="analyzeHeader('${id}')">🔍 Phân tích Header</button>
            <button class="btn-analyze" style="background: linear-gradient(135deg, #a55eea33, #8854d033); border-color: #a55eea88; color: #d1d8e0;" onclick="analyzeContent('${id}')">🧠 Phân tích AI</button>
            <button class="btn-analyze" style="background: linear-gradient(135deg, #e6770033, #ff634733); border-color: #ff634788; color: #ff9f7f;" onclick="analyzeUrls('${id}')">🔗 Truy vết URL</button>
            <button class="btn-verify" onclick="verifyHash('${id}')">🔒 Xác minh SHA-256</button>
        </div>
        <div class="card" style="margin-bottom:16px">
            <h3>🔐 SHA-256 Hash</h3>
            <div class="hash-display">${email.sha256Hash}</div>
            <div id="verify-result-${id}"></div>
        </div>
        <!-- AI Content Analysis Section -->
        <div id="ai-content-section" style="margin-bottom: 20px;">
            ${email.contentAnalysis ? renderContentAnalysis(email.contentAnalysis) : `
                <div class="card" style="border: 1px dashed #a55eea66; text-align: center; padding: 20px;">
                    <div style="font-size: 24px; margin-bottom: 6px;">🧠 Phân tích Social Engineering bằng AI (Qwen 2.5 Local)</div>
                    <p style="color: #888; font-size: 13px; margin-bottom: 12px;">Bóc tách nội dung HTML và nhờ AI phân tích mức độ thao túng tâm lý, đe dọa, lừa đảo.</p>
                    <button class="btn-analyze" style="background: #a55eea33; border-color: #a55eea; color: #fff;" onclick="analyzeContent('${id}')">⚡ Bắt đầu phân tích AI</button>
                </div>
            `}
        </div>
        <!-- URL Analysis Section -->
        <div id="url-analysis-section" style="margin-bottom: 20px;">
            ${email.urlAnalysis ? renderUrlAnalysis(email.urlAnalysis) : ''}
        </div>
        <!-- Header Analysis Section -->
        <div id="analysis-section">
            ${email.headerAnalysis ? renderAnalysis(email.headerAnalysis) : `
                <div class="no-analysis">
                    <p>Chưa phân tích header. Nhấn <strong>🔍 Phân tích Header</strong> để bắt đầu.</p>
                </div>
            `}
        </div>
    `;
}

// Analyze header
async function analyzeHeader(id) {
    const section = document.getElementById('analysis-section');
    section.innerHTML = '<div class="loading"><div class="spinner"></div><p>Đang phân tích header... (tra cứu WHOIS có thể mất vài giây)</p></div>';

    try {
        const res = await fetch(`${API}/analyze/header`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emailId: id })
        });
        const data = await res.json();

        if (data.status === 'success') {
            section.innerHTML = renderAnalysis(data.data);
            // Cập nhật email trong list
            const idx = emails.findIndex(e => e._id === id);
            if (idx >= 0) {
                emails[idx].headerAnalysis = data.data;
                emails[idx].riskScore = data.data.risk_score;
                emails[idx].riskLevel = data.data.risk_level;
            }
            renderList();
            updateStats();
        } else {
            section.innerHTML = `<div class="no-analysis">❌ Lỗi: ${data.error}</div>`;
        }
    } catch (err) {
        section.innerHTML = `<div class="no-analysis">❌ Lỗi kết nối: ${err.message}</div>`;
    }
}

// Analyze AI Content & Social Engineering
async function analyzeContent(id) {
    const section = document.getElementById('ai-content-section');
    section.innerHTML = '<div class="loading"><div class="spinner" style="border-top-color:#a55eea;"></div><p style="color:#d1d8e0;">🧠 Đang kích hoạt AI (Qwen 2.5:3b Local) để bóc tách nội dung & chấm điểm Social Engineering...</p></div>';

    try {
        const res = await fetch(`${API}/analyze/content`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emailId: id })
        });
        const data = await res.json();

        if (data.status === 'success') {
            section.innerHTML = renderContentAnalysis(data.data);
            const idx = emails.findIndex(e => e._id === id);
            if (idx >= 0) {
                emails[idx].contentAnalysis = data.data;
                emails[idx].socialEngineeringScore = data.data.ai_analysis?.data?.social_engineering_score;
                emails[idx].contentVerdict = data.data.ai_analysis?.data?.verdict;
            }
            renderList();
        } else {
            section.innerHTML = `<div class="card" style="border-left: 3px solid #ff4757; color: #ff6b6b;">❌ Lỗi AI: ${data.error}</div>`;
        }
    } catch (err) {
        section.innerHTML = `<div class="card" style="border-left: 3px solid #ff4757; color: #ff6b6b;">❌ Lỗi kết nối: ${err.message}</div>`;
    }
}

function renderContentAnalysis(ca) {
    const ai = ca.ai_analysis?.data || {};
    const meta = ca.metadata || {};
    const keywords = ca.keywords_detected || {};
    const urls = ca.extracted_urls || [];
    const seScore = ai.social_engineering_score ?? 'N/A';
    const verdict = ai.verdict || 'UNKNOWN';
    const urgency = ai.urgency_level || 'LOW';

    let verdictColor = '#2ed573';
    if (verdict === 'PHISHING') verdictColor = '#ff4757';
    else if (verdict === 'SUSPICIOUS') verdictColor = '#ffa502';

    let urgencyColor = '#2ed573';
    if (urgency === 'CRITICAL' || urgency === 'HIGH') urgencyColor = '#ff4757';
    else if (urgency === 'MEDIUM') urgencyColor = '#ffa502';

    const tacticsHtml = (ai.tactics || []).map(t =>
        `<span style="background:#a55eea22; color:#a55eea; border:1px solid #a55eea55; padding:3px 8px; border-radius:12px; font-size:11px; margin-right:6px; font-weight:600;">🛡️ ${escHtml(t)}</span>`
    ).join('') || '<span style="color:#666;">Không phát hiện</span>';

    const keywordsHtml = Object.keys(keywords).map(cat => `
        <div style="margin-bottom: 6px;">
            <strong style="color: #ffa502; font-size: 12px;">${escHtml(cat)}:</strong>
            ${keywords[cat].map(kw => `<span style="background:#ffa50222; color:#ffa502; padding:2px 6px; border-radius:4px; font-size:11px; margin-left:4px;">"${escHtml(kw)}"</span>`).join('')}
        </div>
    `).join('') || '<div style="color:#2ed573; font-size:12px;">✅ Không phát hiện từ khóa giật gân, đe dọa.</div>';

    return `
        <div class="card" style="border: 1px solid #a55eea55; background: #161b2b; margin-bottom: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #ffffff10; padding-bottom:10px;">
                <h3 style="color:#a55eea; margin:0; font-size:14px; display:flex; align-items:center; gap:8px;">
                    <span>🧠</span> KẾT QUẢ PHÂN TÍCH SOCIAL ENGINEERING (AI QWEN 2.5 LOCAL)
                </h3>
                <span style="font-size:11px; color:#888;">Model: ${escHtml(ca.ai_analysis?.model || 'qwen2.5:3b')}</span>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 16px;">
                <!-- SE Score -->
                <div style="background:#0f1420; border-radius:8px; padding:14px; text-align:center; border: 1px solid #ffffff0a;">
                    <div style="font-size:11px; color:#888; text-transform:uppercase; margin-bottom:4px;">Điểm Thao Túng Tâm Lý</div>
                    <div style="font-size:32px; font-weight:bold; color:${verdictColor};">${seScore} <span style="font-size:14px; color:#666;">/ 100</span></div>
                    <span style="display:inline-block; margin-top:4px; padding:3px 10px; border-radius:4px; font-size:11px; font-weight:bold; background:${verdictColor}22; color:${verdictColor};">
                        ${verdict}
                    </span>
                </div>

                <!-- Urgency & Target -->
                <div style="background:#0f1420; border-radius:8px; padding:14px; border: 1px solid #ffffff0a;">

// Analyze URLs & Redirect Chain
async function analyzeUrls(id) {
    const section = document.getElementById('url-analysis-section');
    section.innerHTML = '<div class="loading"><div class="spinner" style="border-top-color:#ff6347;"></div><p style="color:#ff9f7f;">🔗 Đang truy vết URL & Redirect Chain... (tuyệt đối không click trực tiếp)</p></div>';

    try {
        const res = await fetch(`${API}/analyze/urls`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emailId: id })
        });
        const data = await res.json();

        if (data.status === 'success') {
            section.innerHTML = renderUrlAnalysis(data.data);
            const idx = emails.findIndex(e => e._id === id);
            if (idx >= 0) emails[idx].urlAnalysis = data.data;
        } else {
            section.innerHTML = `<div class="card" style="border-left:3px solid #ff4757; color:#ff6b6b;">❌ Lỗi URL scanner: ${data.error}</div>`;
        }
    } catch (err) {
        section.innerHTML = `<div class="card" style="border-left:3px solid #ff4757; color:#ff6b6b;">❌ Lỗi: ${err.message}</div>`;
    }
}

function renderUrlAnalysis(ua) {
    const urls = ua.urls || [];
    const verdict = ua.overall_verdict || 'CLEAN';
    let verdictColor = verdict === 'DANGEROUS' ? '#ff4757' : verdict === 'CAUTION' ? '#ffa502' : '#2ed573';
    let verdictIcon = verdict === 'DANGEROUS' ? '🚨' : verdict === 'CAUTION' ? '⚠️' : '✅';

    if (urls.length === 0) {
        return `<div class="card" style="border:1px solid #2ed57355; text-align:center; padding:20px; color:#2ed573;">✅ Không tìm thấy URL nào trong email.</div>`;
    }

    const urlCards = urls.map(u => {
        const r = u.risk || {};
        const rc = u.redirect_chain || {};
        const chain = rc.chain || [];
        const rColor = r.risk_level === 'HIGH' ? '#ff4757' : r.risk_level === 'MEDIUM' ? '#ffa502' : '#2ed573';
        const us = u.urlscan || {};

        return `
            <div style="background:#0f1420; border-radius:8px; padding:14px; margin-bottom:12px; border: 1px solid ${rColor}44; border-left: 3px solid ${rColor};">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <code style="font-size:12px; color:#00d4ff; word-break:break-all;">${escHtml(u.url)}</code>
                    <span style="padding:3px 10px; border-radius:4px; font-size:11px; font-weight:bold; background:${rColor}22; color:${rColor}; white-space:nowrap; margin-left:8px;">
                        ${r.risk_level || 'N/A'} (${r.risk_score || 0})
                    </span>
                </div>

                <!-- Redirect Chain -->
                <div style="margin-bottom:8px;">
                    <div style="font-size:11px; color:#888; margin-bottom:4px; font-weight:bold;">🔀 Redirect Chain (${rc.total_redirects || 0} lần redirect):</div>
                    <div style="display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-size:11px;">
                        ${chain.map((h, i) => `
                            <span style="background:#1a2836; padding:3px 8px; border-radius:4px; color:${h.is_final ? '#2ed573' : h.status_code >= 300 ? '#ffa502' : '#ddd'};">
                                ${h.status || h.status_code || '?'} ${escHtml((h.url || '').replace(/^https?:\/\//i, '').substring(0, 40))}${(h.url||'').length > 47 ? '...' : ''}
                            </span>
                            ${h.redirect_to ? '<span style="color:#666;">→</span>' : ''}
                        `).join('')}
                    </div>
                    ${rc.domain_changed ? `<div style="color:#ff4757; font-size:11px; margin-top:4px;">🔴 Domain thay đổi: ${escHtml(rc.initial_domain)} → ${escHtml(rc.final_domain)}</div>` : ''}
                </div>

                <!-- Flags -->
                ${(r.flags || []).length > 0 ? `
                    <div style="margin-top:6px;">
                        ${r.flags.map(f => `<div style="font-size:11px; color:#ddd; padding:2px 0;">${f}</div>`).join('')}
                    </div>
                ` : ''}

                <!-- URLScan -->
                ${us.status === 'success' ? `
                    <div style="margin-top:8px; padding:8px 12px; background:#1a2836; border-radius:6px;">
                        <div style="font-size:11px; color:#888; font-weight:bold; margin-bottom:4px;">🌐 URLScan.io Sandbox:</div>
                        <div style="display:flex; gap:12px; flex-wrap:wrap; font-size:11px;">
                            <span>📄 ${escHtml(us.page?.title || 'N/A')}</span>
                            <span>🌍 ${escHtml(us.page?.country || 'N/A')}</span>
                            <span>🖥️ ${escHtml(us.page?.ip || 'N/A')}</span>
                            ${us.verdicts?.overall_malicious ? '<span style="color:#ff4757; font-weight:bold;">🚨 MALICIOUS</span>' : '<span style="color:#2ed573;">✅ Clean</span>'}
                        </div>
                        <a href="${us.scan_url}" target="_blank" style="font-size:11px; color:#00d4ff; text-decoration:none;">🔍 Xem chi tiết trên URLScan.io →</a>
                        ${us.screenshot_url ? `<div style="margin-top:6px;"><img src="${us.screenshot_url}" style="max-width:100%; border-radius:6px; border:1px solid #ffffff15;" onerror="this.style.display='none'"></div>` : ''}
                    </div>
                ` : us.status === 'skipped' ? `<div style="font-size:11px; color:#666; margin-top:4px;">ℹ️ URLScan.io: ${escHtml(us.reason || 'Không có API key')}</div>` : ''}
            </div>
        `;
    }).join('');

    return `
        <div class="card" style="border: 1px solid #ff634755; background: #161b2b; margin-bottom: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #ffffff10; padding-bottom:10px;">
                <h3 style="color:#ff6347; margin:0; font-size:14px; display:flex; align-items:center; gap:8px;">
                    <span>🔗</span> TRUY VẾT URL & REDIRECT CHAIN
                </h3>
                <span style="padding:4px 12px; border-radius:4px; font-size:12px; font-weight:bold; background:${verdictColor}22; color:${verdictColor};">
                    ${verdictIcon} ${verdict} (${ua.total_urls} URLs)
                </span>
            </div>
            ${urlCards}
        </div>
    `;
}

// Verify hash
async function verifyHash(id) {
    const container = document.getElementById(`verify-result-${id}`);
    container.innerHTML = '<div style="color:#888;font-size:12px;margin-top:8px">Đang xác minh...</div>';

    try {
        const res = await fetch(`${API}/inbox/${id}/verify`);
        const data = await res.json();
        const d = data.data;
        container.innerHTML = `
            <div class="verify-result ${d.integrity}">
                ${d.integrity === 'INTACT' ? '✅ INTACT — File chưa bị chỉnh sửa' : '❌ TAMPERED — File đã bị thay đổi!'}
            </div>
        `;
    } catch (err) {
        container.innerHTML = '<div class="verify-result TAMPERED">❌ Lỗi xác minh</div>';
    }
}

// Render analysis results
function renderAnalysis(a) {
    const riskLevel = a.risk_level || 'LOW';
    const riskScore = a.risk_score || 0;
    const auth = a.authentication || {};
    const domain = a.domain_analysis || {};
    const anomalies = a.anomalies || [];
    const headers = a.headers || {};
    const chain = headers.received_chain || [];

    return `
        <div class="cards-grid">
            <!-- Risk Score -->
            <div class="card">

                    <div class="risk-label ${riskLevel}">${riskLevel === 'HIGH' ? '🔴 NGUY CƠ CAO' : riskLevel === 'MEDIUM' ? '🟡 CẦN KIỂM TRA' : '🟢 AN TOÀN'}</div>
                </div>
            </div>

            <!-- Authentication -->
            <div class="card">
                <h3>🛡️ Xác thực Email</h3>
                <div class="auth-grid">
                    <div class="auth-badge ${auth.spf?.status || 'none'}">
                        <div class="protocol">SPF</div>
                        <div class="status">${(auth.spf?.status || 'N/A').toUpperCase()}</div>
                    </div>
                    <div class="auth-badge ${auth.dkim?.status || 'none'}">
                        <div class="protocol">DKIM</div>
                        <div class="status">${(auth.dkim?.status || 'N/A').toUpperCase()}</div>
                    </div>
                    <div class="auth-badge ${auth.dmarc?.status || 'none'}">
                        <div class="protocol">DMARC</div>
                        <div class="status">${(auth.dmarc?.status || 'N/A').toUpperCase()}</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="cards-grid">
            <!-- Domain Analysis -->
            <div class="card">
                <h3>🌐 Phân tích Domain</h3>
                <div class="domain-info">
                    <div class="row"><span class="label">Domain</span><span class="value">${domain.sender_domain || 'N/A'}</span></div>
                    <div class="row"><span class="label">Tuổi domain</span><span class="value ${domain.is_suspicious ? 'suspicious' : ''}">${domain.domain_age_days != null ? domain.domain_age_days + ' ngày' : 'N/A'}</span></div>
                    <div class="row"><span class="label">Ngày đăng ký</span><span class="value">${domain.created_date || 'N/A'}</span></div>
                    <div class="row"><span class="label">Ngày hết hạn</span><span class="value">${domain.expiry_date || 'N/A'}</span></div>
                    <div class="row"><span class="label">Registrar</span><span class="value">${domain.registrar || 'N/A'}</span></div>
                    ${domain.error && domain.error.includes('No match') ? '<div class="row"><span class="label">Trạng thái</span><span class="value suspicious">⚠️ KHÔNG TỒN TẠI</span></div>' : ''}
                </div>
            </div>

            <!-- Anomalies -->
            <div class="card">
                <h3>⚠️ Bất thường (${anomalies.length})</h3>
                ${anomalies.length === 0 ? '<div style="color:#2ed573;text-align:center;padding:20px">✅ Không phát hiện bất thường</div>' : `
                    <ul class="anomaly-list">
                        ${anomalies.map(a => `
                            <li class="anomaly-item ${a.severity}">
                                <span class="icon">${a.severity === 'CRITICAL' ? '🚨' : a.severity === 'HIGH' ? '🔴' : '🟡'}</span>
                                <span><strong>${a.type}</strong><br>${a.detail}</span>
                            </li>
                        `).join('')}
                    </ul>
                `}
            </div>
        </div>

        <!-- Headers Detail -->
        <div class="card">
            <h3>📋 Chi tiết Header</h3>
            <div class="domain-info">
                <div class="row"><span class="label">From</span><span class="value">${escHtml(headers.from || 'N/A')}</span></div>
                <div class="row"><span class="label">Return-Path</span><span class="value">${escHtml(headers.return_path || 'N/A')}</span></div>
                <div class="row"><span class="label">Reply-To</span><span class="value">${escHtml(headers.reply_to || 'N/A')}</span></div>
                <div class="row"><span class="label">Message-ID</span><span class="value" style="font-size:11px">${escHtml(headers.message_id || 'N/A')}</span></div>
                <div class="row"><span class="label">Date</span><span class="value">${escHtml(headers.date || 'N/A')}</span></div>
                <div class="row"><span class="label">X-Mailer</span><span class="value">${escHtml(headers.x_mailer || 'N/A')}</span></div>
            </div>
        </div>

        ${chain.length > 0 ? `
            <div class="card" style="margin-top:16px">
                <h3>🔗 Received Chain (${chain.length} hops)</h3>
                ${chain.map(h => `
                    <div class="hop-item">
                        <div class="hop-num">Hop ${h.hop}</div>
                        <div class="hop-detail">
                            ${h.from ? `From: <span>${h.from}</span>` : ''}
                            ${h.by ? ` → By: <span>${h.by}</span>` : ''}

                        </div>
                    </div>
                `).join('')}
            </div>
        ` : ''}
    `;
}

// Collect emails
async function collectEmails() {
    const btn = document.getElementById('btn-collect');
    btn.disabled = true;
    btn.textContent = 'Đang thu...';
    try {
        const res = await fetch(`${API}/inbox/collect`, { method: 'POST' });
        const data = await res.json();
        await loadEmails();
        btn.textContent = `✅ +${(data.data?.collected || []).length}`;
        setTimeout(() => { btn.textContent = 'Thu thập'; btn.disabled = false; }, 2000);
    } catch (err) {
        btn.textContent = '❌ Lỗi';
        setTimeout(() => { btn.textContent = 'Thu thập'; btn.disabled = false; }, 2000);
    }
}

// Helpers
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function riskColor(level) { return level === 'HIGH' ? '#ff4757' : level === 'MEDIUM' ? '#ffa502' : '#2ed573'; }
function formatSize(bytes) { return bytes > 1024 ? (bytes / 1024).toFixed(1) + ' KB' : bytes + ' B'; }
function decodeSubject(s) {
    if (!s) return 'No Subject';
    // Decode simple Base64 encoded subjects
    const decoded = s.replace(/=\?UTF-8\?B\?([A-Za-z0-9+/=]+)\?=/gi, (_, b64) => {
        try { return atob(b64).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''); }
        catch(e) { return _; }
    });
    try { return decodeURIComponent(decoded).replace(/\r?\n\t?/g, ''); }
    catch(e) { return s.replace(/=\?UTF-8\?B\?[^?]+\?=/gi, '[Encoded]').replace(/\r?\n\t?/g, ''); }
}

// Init
loadEmails();
