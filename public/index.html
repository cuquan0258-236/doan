<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SOAR — Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Header */
        .top-bar {
            background: linear-gradient(135deg, #1a2332, #243447);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #00d4ff33;
        }
        .top-bar h1 {
            font-size: 22px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar h1 span { font-size: 26px; }
        .top-bar .stats {
            display: flex;
            gap: 24px;
        }
        .stat-box {
            text-align: center;
            padding: 6px 18px;
            background: #0f1923;
            border-radius: 8px;
            border: 1px solid #ffffff15;
        }
        .stat-box .num {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-box .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        .stat-box.high .num, .stat-box.malicious .num { color: #ff4757; }
        .stat-box.medium .num, .stat-box.suspicious .num { color: #ffa502; }
        .stat-box.low .num, .stat-box.clean .num { color: #2ed573; }
        .stat-box.total .num { color: #00d4ff; }

        /* Main */
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        /* Email List */
        .email-list {
            width: 420px;
            background: #141e2b;
            border-right: 1px solid #ffffff10;
            overflow-y: auto;
        }
        .list-header {
            padding: 14px 18px;
            background: #1a2836;
            border-bottom: 1px solid #ffffff10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-header h2 { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .btn-collect {
            padding: 6px 14px;
            background: #00d4ff22;
            color: #00d4ff;
            border: 1px solid #00d4ff44;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-collect:hover { background: #00d4ff44; }
        .btn-collect:disabled { opacity: 0.5; cursor: not-allowed; }

        .email-item {
            padding: 14px 18px;
            border-bottom: 1px solid #ffffff08;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .email-item:hover { background: #1c2a3a; }
        .email-item.active { background: #1c2a3a; border-left: 3px solid #00d4ff; }
        .email-item .risk-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .risk-dot.HIGH, .risk-dot.MALICIOUS { background: #ff4757; box-shadow: 0 0 6px #ff475766; }
        .risk-dot.MEDIUM, .risk-dot.SUSPICIOUS { background: #ffa502; box-shadow: 0 0 6px #ffa50266; }
        .risk-dot.LOW, .risk-dot.CLEAN { background: #2ed573; box-shadow: 0 0 6px #2ed57366; }
        .risk-dot.INCONCLUSIVE { background: #70a1ff; box-shadow: 0 0 6px #70a1ff66; }
        .risk-dot.none { background: #555; }
        .email-item .info { flex: 1; min-width: 0; }
        .email-item .sender {
            font-size: 13px;
            font-weight: 600;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .email-item .subject {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .email-item .meta-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
        }
        .tag.status-collected { background: #00d4ff22; color: #00d4ff; }
        .tag.status-analyzed { background: #2ed57322; color: #2ed573; }
        .tag.status-analyzing { background: #ffa50222; color: #ffa502; }
        .tag.status-error { background: #ff475722; color: #ff4757; }

        /* Detail Panel */
        .detail-panel {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }
        .detail-panel .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            font-size: 16px;
        }

        .detail-header {
            margin-bottom: 24px;
        }
        .detail-header h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }
        .detail-header .detail-meta {
            color: #888;
            font-size: 13px;
        }
        .detail-header .detail-meta span { margin-right: 16px; }

        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: #1a2836;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #ffffff10;
        }
        .card h3 {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Risk Score */
        .risk-display {
            text-align: center;
            padding: 20px;
        }
        .risk-score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 32px;
            font-weight: bold;
        }
        .risk-score-circle.HIGH { background: #ff475722; color: #ff4757; border: 3px solid #ff4757; }
        .risk-score-circle.MEDIUM { background: #ffa50222; color: #ffa502; border: 3px solid #ffa502; }
        .risk-score-circle.LOW { background: #2ed57322; color: #2ed573; border: 3px solid #2ed573; }
        .risk-label {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }
        .risk-label.HIGH { color: #ff4757; }
        .risk-label.MEDIUM { color: #ffa502; }
        .risk-label.LOW { color: #2ed573; }

        /* Auth badges */
        .auth-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .auth-badge {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 14px 10px;
            border-radius: 8px;
            border: 1px solid #ffffff10;
        }
        .auth-badge .protocol { font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 600; }
        .auth-badge .status { font-size: 18px; font-weight: bold; }
        .auth-badge.pass { background: #2ed57312; }
        .auth-badge.pass .status { color: #2ed573; }
        .auth-badge.fail, .auth-badge.softfail { background: #ff475712; }
        .auth-badge.fail .status, .auth-badge.softfail .status { color: #ff4757; }
        .auth-badge.none { background: #ffa50212; }
        .auth-badge.none .status { color: #ffa502; }

        /* Domain info */
        .domain-info { line-height: 2; }
        .domain-info .row { display: flex; justify-content: space-between; border-bottom: 1px solid #ffffff08; }
        .domain-info .label { color: #888; font-size: 13px; }
        .domain-info .value { color: #ddd; font-size: 13px; font-weight: 600; }
        .domain-info .value.suspicious { color: #ff4757; }

        /* Anomalies */
        .anomaly-list { list-style: none; }
        .anomaly-item {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .anomaly-item .icon { font-size: 16px; flex-shrink: 0; }
        .anomaly-item.CRITICAL { background: #ff475718; border-left: 3px solid #ff4757; }
        .anomaly-item.HIGH { background: #ff634718; border-left: 3px solid #ff6347; }
        .anomaly-item.MEDIUM { background: #ffa50218; border-left: 3px solid #ffa502; }

        /* Received chain */
        .hop-item {
            padding: 10px 14px;
            margin-bottom: 6px;
            background: #0f1923;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Consolas', monospace;
            border-left: 2px solid #00d4ff44;
        }
        .hop-item .hop-num { color: #00d4ff; font-weight: bold; margin-bottom: 4px; }
        .hop-item .hop-detail { color: #999; }
        .hop-item .hop-detail span { color: #ddd; }

        /* Buttons */
        .btn-analyze {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff22, #0099cc22);
            color: #00d4ff;
            border: 1px solid #00d4ff44;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            margin-right: 8px;
        }
        .btn-analyze:hover { background: linear-gradient(135deg, #00d4ff44, #0099cc44); }
        .btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-verify {
            padding: 10px 20px;
            background: #2ed57322;
            color: #2ed573;
            border: 1px solid #2ed57344;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-verify:hover { background: #2ed57344; }

        .actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        /* SHA hash */
        .hash-display {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #00d4ff;
            background: #0f1923;
            padding: 10px 14px;
            border-radius: 6px;
            word-break: break-all;
        }
        .verify-result {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .verify-result.INTACT { background: #2ed57322; color: #2ed573; }
        .verify-result.TAMPERED { background: #ff475722; color: #ff4757; }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #555;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* No analysis message */
        .no-analysis {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        .no-analysis p { margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="top-bar">
    <h1><span>🛡️</span> Mini SOAR Dashboard</h1>
    <div class="stats">
        <div class="stat-box total"><div class="num" id="stat-total">-</div><div class="label">Tổng email</div></div>
        <div class="stat-box malicious"><div class="num" id="stat-malicious">-</div><div class="label">🔴 Malicious</div></div>
        <div class="stat-box suspicious"><div class="num" id="stat-suspicious">-</div><div class="label">🟡 Suspicious</div></div>
        <div class="stat-box clean"><div class="num" id="stat-clean">-</div><div class="label">🟢 Clean / Low</div></div>
    </div>
</div>

<div class="container">
    <!-- Email List -->
    <div class="email-list">
        <div class="list-header">
            <h2>📥 Inbox</h2>
            <button class="btn-collect" id="btn-collect" onclick="collectEmails()">Thu thập</button>
        </div>
        <div id="email-list-body">
            <div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>
        </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detail-panel">
        <div class="placeholder">← Chọn một email để xem chi tiết phân tích</div>
    </div>
</div>

<script>
const API = 'http://localhost:3000/api';
let emails = [];
let selectedId = null;

// Load email list
async function loadEmails() {
    try {
        const res = await fetch(`${API}/inbox?limit=50`);
        const data = await res.json();
        emails = data.data.emails;
        renderList();
        updateStats();
    } catch (err) {
        document.getElementById('email-list-body').innerHTML =
            '<div class="loading">❌ Không kết nối được server<br><small>Chạy <code>npm start</code> trước</small></div>';
    }
}

function renderList() {
    const container = document.getElementById('email-list-body');
    if (!emails.length) {
        container.innerHTML = '<div class="loading">Chưa có email nào</div>';
        return;
    }
    container.innerHTML = emails.map(e => {
        const v = e.riskLevel || (e.riskScore >= 75 ? 'MALICIOUS' : e.riskScore >= 50 ? 'SUSPICIOUS' : (e.riskScore !== null && e.riskScore !== undefined) ? 'CLEAN' : 'none');
        return `
        <div class="email-item ${e._id === selectedId ? 'active' : ''}" onclick="selectEmail('${e._id}')">
            <div class="risk-dot ${v}"></div>
            <div class="info">
                <div class="sender">${escHtml(e.sender)}</div>
                <div class="subject">${decodeSubject(e.subject)}</div>
                <div class="meta-row">
                    <span class="tag status-${e.status}">${e.status}</span>
                    ${e.riskLevel || typeof e.riskScore === 'number' ? `<span class="tag" style="background:${riskColor(v)}22;color:${riskColor(v)}">${v} (${e.riskScore ?? e.overallRiskScore ?? 0})</span>` : ''}
                    <span class="tag" style="background:#ffffff08;color:#666">${formatSize(e.fileSize)}</span>
                </div>
            </div>
        </div>
    `;
    }).join('');
}

function updateStats() {
    document.getElementById('stat-total').textContent = emails.length;
    const maliciousCount = emails.filter(e => e.riskLevel === 'MALICIOUS' || e.riskLevel === 'HIGH').length;
    const suspiciousCount = emails.filter(e => e.riskLevel === 'SUSPICIOUS' || e.riskLevel === 'MEDIUM').length;
    const cleanCount = emails.filter(e => e.riskLevel === 'CLEAN' || e.riskLevel === 'LOW' || (!e.riskLevel && (e.riskScore || 0) < 50)).length;

    const elMal = document.getElementById('stat-malicious');
    if (elMal) elMal.textContent = maliciousCount;
    const elSusp = document.getElementById('stat-suspicious');
    if (elSusp) elSusp.textContent = suspiciousCount;
    const elClean = document.getElementById('stat-clean');
    if (elClean) elClean.textContent = cleanCount;
}

// Select email
async function selectEmail(id) {
    selectedId = id;
    renderList();
    const email = emails.find(e => e._id === id);
    const panel = document.getElementById('detail-panel');

    panel.innerHTML = `
        <div class="detail-header">
            <h2>${decodeSubject(email.subject)}</h2>
            <div class="detail-meta">
                <span>👤 ${escHtml(email.sender)}</span>
                <span>📩 ${escHtml(email.recipient)}</span>
                <span>📅 ${new Date(email.collectedAt).toLocaleString('vi-VN')}</span>
            </div>
        </div>
        <div class="actions-bar">
            <button class="btn-analyze" onclick="analyzeHeader('${id}')">🔍 Phân tích Header</button>
            <button class="btn-analyze" style="background: linear-gradient(135deg, #a55eea33, #8854d033); border-color: #a55eea88; color: #d1d8e0;" onclick="analyzeContent('${id}')">🧠 Phân tích AI</button>
            <button class="btn-analyze" style="background: linear-gradient(135deg, #e6770033, #ff634733); border-color: #ff634788; color: #ff9f7f;" onclick="analyzeUrls('${id}')">🔗 Truy vết URL</button>
            <button class="btn-analyze" style="background: linear-gradient(135deg, #20bf6b33, #0fb9b133); border-color: #20bf6b88; color: #2bcbba;" onclick="analyzeAttachments('${id}')">📎 Phân tích Attachment</button>
            <button class="btn-analyze" style="background: linear-gradient(135deg, #3867d633, #4b7bec33); border-color: #4b7bec88; color: #45aaf2;" onclick="analyzeIOC('${id}')">🌐 Làm rõ IOC (Threat Intel)</button>
            <button class="btn-verify" onclick="verifyHash('${id}')">🔒 Xác minh SHA-256</button>
            <button class="btn-analyze" style="background: linear-gradient(135deg, #2ed57333, #2bcbba33); border-color: #2ed57388; color: #2ed573; font-weight: bold;" onclick="openReportPDF('${id}')">📄 Báo cáo PDF</button>
        </div>
        <!-- Step 8: Response & Reporting Section -->
        <div id="response-reporting-section" style="margin-bottom: 20px;">
            ${renderResponseSection(email)}
        </div>
        <div class="card" style="margin-bottom:16px">
            <h3>🔐 SHA-256 Hash</h3>
            <div class="hash-display">${email.sha256Hash}</div>
            <div id="verify-result-${id}"></div>
        </div>
        <!-- AI Content Analysis Section -->
        <div id="ai-content-section" style="margin-bottom: 20px;">
            ${email.contentAnalysis ? renderContentAnalysis(email.contentAnalysis) : `
                <div class="card" style="border: 1px dashed #a55eea66; text-align: center; padding: 20px;">
                    <div style="font-size: 24px; margin-bottom: 6px;">🧠 Phân tích Social Engineering bằng AI (Qwen 2.5 Local)</div>
                    <p style="color: #888; font-size: 13px; margin-bottom: 12px;">Bóc tách nội dung HTML và nhờ AI phân tích mức độ thao túng tâm lý, đe dọa, lừa đảo.</p>
                    <button class="btn-analyze" style="background: #a55eea33; border-color: #a55eea; color: #fff;" onclick="analyzeContent('${id}')">⚡ Bắt đầu phân tích AI</button>
                </div>
            `}
        </div>
        <!-- URL Analysis Section -->
        <div id="url-analysis-section" style="margin-bottom: 20px;">
            ${email.urlAnalysis ? renderUrlAnalysis(email.urlAnalysis) : ''}
        </div>
        <!-- Attachment Analysis Section -->
        <div id="attachment-analysis-section" style="margin-bottom: 20px;">
            ${email.attachmentAnalysis ? renderAttachmentAnalysis(email.attachmentAnalysis) : ''}
        </div>
        <!-- IOC Threat Intelligence Section (Step 6) -->
        <div id="ioc-analysis-section" style="margin-bottom: 20px;">
            ${email.iocAnalysis ? renderIOCAnalysis(email.iocAnalysis) : ''}
        </div>
        <!-- Header Analysis Section -->
        <div id="analysis-section">
            ${email.headerAnalysis ? renderAnalysis(email.headerAnalysis) : `
                <div class="no-analysis">
                    <p>Chưa phân tích header. Nhấn <strong>🔍 Phân tích Header</strong> để bắt đầu.</p>
                </div>
            `}
        </div>
    `;
}

// Analyze header
async function analyzeHeader(id) {
    const section = document.getElementById('analysis-section');
    section.innerHTML = '<div class="loading"><div class="spinner"></div><p>Đang phân tích header... (tra cứu WHOIS có thể mất vài giây)</p></div>';

    try {
        const res = await fetch(`${API}/analyze/header`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emailId: id })
        });
        const data = await res.json();

        if (data.status === 'success') {
            section.innerHTML = renderAnalysis(data.data);
            // Cập nhật email trong list
            const idx = emails.findIndex(e => e._id === id);
            if (idx >= 0) {
                emails[idx].headerAnalysis = data.data;
                emails[idx].riskScore = data.data.risk_score;
                emails[idx].riskLevel = data.data.risk_level;
            }
            renderList();
            updateStats();
        } else {
            section.innerHTML = `<div class="no-analysis">❌ Lỗi: ${data.error}</div>`;
        }
    } catch (err) {
        section.innerHTML = `<div class="no-analysis">❌ Lỗi kết nối: ${err.message}</div>`;
    }
}

// Analyze AI Content & Social Engineering
async function analyzeContent(id) {
    const section = document.getElementById('ai-content-section');
    section.innerHTML = '<div class="loading"><div class="spinner" style="border-top-color:#a55eea;"></div><p style="color:#d1d8e0;">🧠 Đang kích hoạt AI (Qwen 2.5:3b Local) để bóc tách nội dung & chấm điểm Social Engineering...</p></div>';

    try {
        const res = await fetch(`${API}/analyze/content`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emailId: id })
        });
        const data = await res.json();

        if (data.status === 'success') {
            section.innerHTML = renderContentAnalysis(data.data);
            const idx = emails.findIndex(e => e._id === id);
            if (idx >= 0) {
                emails[idx].contentAnalysis = data.data;
                emails[idx].socialEngineeringScore = data.data.ai_analysis?.data?.social_engineering_score;
                emails[idx].contentVerdict = data.data.ai_analysis?.data?.verdict;
            }
            renderList();
        } else {
            section.innerHTML = `<div class="card" style="border-left: 3px solid #ff4757; color: #ff6b6b;">❌ Lỗi AI: ${data.error}</div>`;
        }
    } catch (err) {
        section.innerHTML = `<div class="card" style="border-left: 3px solid #ff4757; color: #ff6b6b;">❌ Lỗi kết nối: ${err.message}</div>`;
    }
}

function renderContentAnalysis(ca) {
    const ai = ca.ai_analysis?.data || {};
    const meta = ca.metadata || {};
    const keywords = ca.keywords_detected || {};
    const urls = ca.extracted_urls || [];
    const seScore = ai.social_engineering_score ?? 'N/A';
    const verdict = ai.verdict || 'UNKNOWN';
    const urgency = ai.urgency_level || 'LOW';

    let verdictColor = '#2ed573';
    if (verdict === 'PHISHING') verdictColor = '#ff4757';
    else if (verdict === 'SUSPICIOUS') verdictColor = '#ffa502';

    let urgencyColor = '#2ed573';
    if (urgency === 'CRITICAL' || urgency === 'HIGH') urgencyColor = '#ff4757';
    else if (urgency === 'MEDIUM') urgencyColor = '#ffa502';

    const tacticsHtml = (ai.tactics || []).map(t =>
        `<span style="background:#a55eea22; color:#a55eea; border:1px solid #a55eea55; padding:3px 8px; border-radius:12px; font-size:11px; margin-right:6px; font-weight:600;">🛡️ ${escHtml(t)}</span>`
    ).join('') || '<span style="color:#666;">Không phát hiện</span>';

    const keywordsHtml = Object.keys(keywords).map(cat => `
        <div style="margin-bottom: 6px;">
            <strong style="color: #ffa502; font-size: 12px;">${escHtml(cat)}:</strong>

    const urls = ua.urls || [];

    }

    const urlCards = urls.map(u => {
        const r = u.risk || {};
        const rc = u.redirect_chain || {};
        const chain = rc.chain || [];
        const rColor = r.risk_level === 'HIGH' ? '#ff4757' : r.risk_level === 'MEDIUM' ? '#ffa502' : '#2ed573';

                    <span style="padding:3px 10px; border-radius:4px; font-size:11px; font-weight:bold; background:${rColor}22; color:${rColor}; white-space:nowrap; margin-left:8px;">
                        ${r.risk_level || 'N/A'} (${r.risk_score || 0})

                </div>

                <!-- Redirect Chain -->
                <div style="margin-bottom:8px;">
                    <div style="font-size:11px; color:#888; margin-bottom:4px; font-weight:bold;">🔀 Redirect Chain (${rc.total_redirects || 0} lần redirect):</div>
                    <div style="display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-size:11px;">
                        ${chain.map((h, i) => `
                            <span style="background:#1a2836; padding:3px 8px; border-radius:4px; color:${h.is_final ? '#2ed573' : h.status_code >= 300 ? '#ffa502' : '#ddd'};">
                                ${h.status || h.status_code || '?'} ${escHtml((h.url || '').replace(/^https?:\/\//i, '').substring(0, 40))}${(h.url||'').length > 47 ? '...' : ''}

                    ${rc.domain_changed ? `<div style="color:#ff4757; font-size:11px; margin-top:4px;">🔴 Domain thay đổi: ${escHtml(rc.initial_domain)} → ${escHtml(rc.final_domain)}</div>` : ''}

                    <div style="margin-top:6px;">
                        ${r.flags.map(f => `<div style="font-size:11px; color:#ddd; padding:2px 0;">${f}</div>`).join('')}

                    <div style="margin-top:6px; font-size:11px; color:#ddd; background:#1a2334; padding:6px 10px; border-radius:4px;">
                        <strong style="color:#00d4ff;">🦠 VirusTotal:</strong> 
                        Phát hiện: <strong style="color:${vt.maliciousCount > 0 ? '#ff4757' : '#2ed573'};">${vt.detectionRatio || (vt.maliciousCount + '/' + vt.totalEngines)}</strong> Antivirus | 
                        ${vt.threatLabel ? `Nhãn: <code style="color:#ffa502;">${escHtml(vt.threatLabel)}</code> | ` : ''}
                        ${vt.reportUrl ? `<a href="${vt.reportUrl}" target="_blank" style="color:#00d4ff; text-decoration:none;">Xem báo cáo VT →</a>` : ''}
                    </div>
                `;
            } else if (vt.status === 'not_found') {
                detailsHtml += `
                    <div style="margin-top:6px; font-size:11px; color:#888;">
                        VirusTotal: ${escHtml(vt.message || 'Không tìm thấy mẫu')}
                    </div>
                `;
            }
        }

        // Chi tiết nguồn URLhaus (cho URL/Domain)
        if (s.urlhaus) {
            const uh = s.urlhaus;
            if (uh.status === 'success') {
                detailsHtml += `
                    <div style="margin-top:6px; font-size:11px; color:#ddd; background:#1a2334; padding:6px 10px; border-radius:4px;">
                        <strong style="color:#ff6b6b;">🚨 URLhaus (abuse.ch):</strong> 
                        ${uh.listed ? `<span style="color:#ff4757; font-weight:bold;">ĐÃ BỊ LIỆT VÀO DANH SÁCH ĐEN!</span> (${escHtml(uh.threat || 'Malware')} - Trạng thái: ${escHtml(uh.urlStatus || 'Online')})` : '<span style="color:#2ed573;">Clean (Không nằm trong blacklist)</span>'}
                    </div>
                `;
            }
        }

        // Chi tiết nguồn PhishTank (cho URL)
        if (s.phishtank) {
            const pt = s.phishtank;
            if (pt.status === 'success') {
                let ptHtml = '';
                if (pt.inDatabase && pt.valid) {
                    ptHtml = `<span style="color:#ff4757; font-weight:bold;">🚨 XÁC NHẬN LỪA ĐẢO (Phishing Site - ID: ${pt.phishId})</span> | <a href="${escHtml(pt.phishDetailPage || '')}" target="_blank" style="color:#00d4ff; text-decoration:none;">Xem bằng chứng trên PhishTank →</a>`;
                } else if (pt.inDatabase && pt.verified && !pt.valid) {
                    ptHtml = `<span style="color:#2ed573; font-weight:bold;">✅ ĐÃ XÁC MINH AN TOÀN</span> (Bài nộp #${pt.phishId} đã được cộng đồng PhishTank xác nhận <span style="color:#2ed573;">KHÔNG PHẢI</span> lừa đảo) | <a href="${escHtml(pt.phishDetailPage || '')}" target="_blank" style="color:#00d4ff; text-decoration:none;">Xem chi tiết →</a>`;
                } else if (pt.inDatabase && !pt.verified) {
                    ptHtml = `<span style="color:#ffa502; font-weight:bold;">⚠️ ĐANG CHỜ XÁC MINH</span> (Bài nộp #${pt.phishId} đang chờ cộng đồng thẩm định) | <a href="${escHtml(pt.phishDetailPage || '')}" target="_blank" style="color:#00d4ff; text-decoration:none;">Xem chi tiết →</a>`;
                } else {
                    ptHtml = '<span style="color:#2ed573;">Không có trong cơ sở dữ liệu lừa đảo PhishTank</span>';
                }

                detailsHtml += `
                    <div style="margin-top:6px; font-size:11px; color:#ddd; background:#1a2334; padding:6px 10px; border-radius:4px;">
                        <strong style="color:#ffa502;">🎣 PhishTank:</strong> ${ptHtml}
                    </div>
                `;
            }
        }

        return `
            <div style="background:#0f1420; border-radius:8px; padding:12px 14px; margin-bottom:10px; border:1px solid ${itemColor}44; border-left:3px solid ${itemColor};">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                        <span style="background:${typeBadgeColor}22; color:${typeBadgeColor}; border:1px solid ${typeBadgeColor}55; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:bold; text-transform:uppercase;">
                            ${ioc.iocType}
                        </span>
                        <code style="font-size:12px; color:#fff; word-break:break-all;">${escHtml(ioc.iocValue)}</code>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; white-space:nowrap; margin-left:12px;">
                        ${ioc.fromCache ? `
                            <span style="font-size:10px; background:#2ed57315; color:#2ed573; border:1px solid #2ed57344; padding:2px 6px; border-radius:4px;" title="Lấy từ Cache MongoDB trong vòng 24h">
                                ⚡ Cache (${ioc.cacheAgeMinutes ? ioc.cacheAgeMinutes + 'p' : '<24h'})
                            </span>
                        ` : `
                            <span style="font-size:10px; background:#00d4ff15; color:#00d4ff; border:1px solid #00d4ff44; padding:2px 6px; border-radius:4px;">
                                🌐 API Live
                            </span>
                        `}
                        <span style="padding:2px 8px; border-radius:4px; font-size:11px; font-weight:bold; background:${itemColor}22; color:${itemColor};">
                            ${ioc.verdict} (${score}/100)
                        </span>
                    </div>
                </div>
                ${detailsHtml}
            </div>
        `;
    }).join('');

    return `
        <div class="card" style="border: 1px solid #45aaf255; background: #161b2b; margin-bottom: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #ffffff10; padding-bottom:10px;">
                <h3 style="color:#45aaf2; margin:0; font-size:14px; display:flex; align-items:center; gap:8px;">
                    <span>🌐</span> THREAT INTELLIGENCE & IOC REPUTATION (${total} IOCS)
                </h3>
                <span style="padding:4px 12px; border-radius:4px; font-size:12px; font-weight:bold; background:${verdictColor}22; color:${verdictColor};">
                    ${verdictIcon} ${verdict}
                </span>
            </div>

            <!-- Stats Bar -->
            <div style="display:flex; justify-content:space-between; align-items:center; background:#0f1420; padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:11px; flex-wrap:wrap; gap:8px;">
                <div style="display:flex; gap:16px;">
                    <span>🚨 <strong style="color:#ff4757;">${data.maliciousCount || 0}</strong> Malicious</span>
                    <span>⚠️ <strong style="color:#ffa502;">${data.suspiciousCount || 0}</strong> Suspicious</span>
                    <span>🟢 <strong style="color:#2ed573;">${data.safeCount || 0}</strong> Safe</span>
                </div>
                <div style="color:#aaa;">
                    ⚡ <strong>${cachedCount}/${total}</strong> IOCs từ Cache MongoDB (<24h) | Tỷ lệ trúng cache: <strong style="color:#2ed573;">${hitRate}</strong>
                </div>
            </div>

            ${iocCards}
        </div>
    `;
}

// Verify hash
async function verifyHash(id) {
    const container = document.getElementById(`verify-result-${id}`);
    container.innerHTML = '<div style="color:#888;font-size:12px;margin-top:8px">Đang xác minh...</div>';

    try {
        const res = await fetch(`${API}/inbox/${id}/verify`);
        const data = await res.json();
        const d = data.data;
        container.innerHTML = `
            <div class="verify-result ${d.integrity}">
                ${d.integrity === 'INTACT' ? '✅ INTACT — File chưa bị chỉnh sửa' : '❌ TAMPERED — File đã bị thay đổi!'}
            </div>
        `;
    } catch (err) {
        container.innerHTML = '<div class="verify-result TAMPERED">❌ Lỗi xác minh</div>';
    }
}

// Render analysis results

// Phản ứng (Response) & Báo cáo
function renderResponseSection(email) {
    if (!email) return '';
    const id = email._id;

    // Overall Risk synthesis
    const scores = [];
    if (typeof email.riskScore === 'number') scores.push(email.riskScore);
    if (typeof email.socialEngineeringScore === 'number') scores.push(email.socialEngineeringScore);
    if (email.urlAnalysis && typeof email.urlAnalysis.risk_score === 'number') scores.push(email.urlAnalysis.risk_score);
    if (email.attachmentAnalysis && typeof email.attachmentAnalysis.risk_score === 'number') scores.push(email.attachmentAnalysis.risk_score);
    if (email.iocAnalysis && typeof email.iocAnalysis.overallRiskScore === 'number') scores.push(email.iocAnalysis.overallRiskScore);

    const ruleEval = email.ruleEvaluation;
    const overallScore = ruleEval?.totalScore ?? (scores.length > 0 
        ? Math.round(Math.max(...scores) * 0.7 + (scores.reduce((a, b) => a + b, 0) / scores.length) * 0.3)
        : (email.riskScore || 0));

    const overallLevel = ruleEval?.verdict ?? (overallScore >= 75 ? 'MALICIOUS' : overallScore >= 50 ? 'SUSPICIOUS' : 'CLEAN');
    const statusColor = riskColor(overallLevel);

    return `
        <div class="card" style="border: 1px solid #eb3b5a66; background: #131826;">
            <!-- Header -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid #ffffff15; padding-bottom:12px; flex-wrap:wrap; gap:10px;">
                <div>
                    <h3 style="color:#fc5c65; margin:0; font-size:15px; display:flex; align-items:center; gap:8px;">
                        <span>🚨</span> PHẢN ỨNG (RESPONSE) & XUẤT BÁO CÁO SỰ CỐ SOC
                    </h3>
                    <div style="color:#888; font-size:11px; margin-top:2px;">Tự động hóa Xử lý Hộp thư Gmail (Vứt vào Spam / Xóa Thư) &amp; Xuất Báo Cáo Chuẩn</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button onclick="openReportPDF('${id}')" style="background:#2ed57322; border:1px solid #2ed573; color:#2ed573; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold; display:inline-flex; align-items:center; gap:6px;">
                        📄 Mở / In Báo Cáo PDF
                    </button>
                </div>
            </div>

            <!-- Overall Risk Assessment Banner -->
            <div style="display:flex; justify-content:space-between; align-items:center; background:#0b0f19; padding:12px 16px; border-radius:8px; margin-bottom:16px; border:1px solid ${statusColor}33;">
                <div>
                    <div style="font-size:11px; text-transform:uppercase; color:#888; letter-spacing:0.5px; margin-bottom:2px;">Tổng hợp phân cấp Rule Engine (Verdict & Risk Score)</div>
                    <div style="font-size:15px; font-weight:bold; color:${statusColor};">
                        ${overallLevel === 'MALICIOUS' ? '🔴 NGUY HIỂM (MALICIOUS) — XÓA KHỎI HỘP THƯ ĐẾN' : overallLevel === 'SUSPICIOUS' ? '🟡 ĐÁNG NGỜ (SUSPICIOUS) — VỨT VÀO THƯ MỤC SPAM' : overallLevel === 'LOW' ? '🟡 RỦI RO THẤP (LOW RISK) — GIỮ TRONG INBOX' : '🟢 AN TOÀN (CLEAN) — GIỮ TRONG INBOX'}
                    </div>
                </div>
                <div style="text-align:right;">
                    <span style="font-size:24px; font-weight:bold; color:${statusColor};">${overallScore}</span>
                    <span style="color:#888; font-size:12px;">/100</span>
                </div>
            </div>

            ${ruleEval ? `
            <!-- Rule Engine Matrix Card -->
            <div style="background:#0f1422; border-radius:8px; padding:12px 14px; margin-bottom:16px; border:1px solid #ffffff15;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <div style="font-size:12px; font-weight:bold; color:#00d4ff; text-transform:uppercase;">
                        ⚙️ Ma Trận Quy Tắc Đánh Giá (SOAR Rule Engine)
                    </div>
                    <span style="font-size:11px; padding:3px 8px; border-radius:4px; font-weight:bold; background:${statusColor}22; color:${statusColor};">
                        ${ruleEval.verdict} (${ruleEval.totalScore}/100đ)
                    </span>
                </div>

                <div style="font-size:11px; color:#aaa; margin-bottom:10px;">
                    <div style="margin-bottom:6px; font-weight:bold; color:#888;">HÀNH ĐỘNG QUY ĐỊNH (SOAR PLAYBOOK):</div>
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        ${(ruleEval.actionNameVi || '').split(' | ').map(act => `
                            <div style="background:#161d2d; padding:5px 10px; border-radius:4px; border-left:3px solid #2bcbba; color:#2bcbba; font-size:11px; font-weight:500;">
                                ⚡ ${escHtml(act)}
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${ruleEval.typosquatInfo ? `
                    <div style="background:#ff475722; color:#ff6b81; border:1px solid #ff475744; padding:6px 10px; border-radius:4px; font-size:11px; margin-bottom:6px;">
                        🎯 <strong>Phát hiện Typosquatting (+20đ):</strong> Chuỗi '<strong>${escHtml(ruleEval.typosquatInfo.matchedToken)}</strong>' giả mạo thương hiệu <strong>${escHtml(ruleEval.typosquatInfo.brand.toUpperCase())}</strong> (Levenshtein: ${ruleEval.typosquatInfo.distance})

                    <div style="background:#161d2d; padding:6px 10px; border-radius:4px;">Domain & Typosquat: <strong style="color:#fff;">${ruleEval.moduleScores?.domainAge || 0}</strong>/45đ</div>
                    <div style="background:#161d2d; padding:6px 10px; border-radius:4px;">AI LLM: <strong style="color:#fff;">${ruleEval.moduleScores?.llm || 0}</strong>/20đ</div>
                    <div style="background:#161d2d; padding:6px 10px; border-radius:4px;">URL Scanner: <strong style="color:#fff;">${ruleEval.moduleScores?.url || 0}</strong>/35đ</div>
                    <div style="background:#161d2d; padding:6px 10px; border-radius:4px;">Tệp đính kèm: <strong style="color:#fff;">${ruleEval.moduleScores?.attachment || 0}</strong>/40đ</div>
                    <div style="background:#161d2d; padding:6px 10px; border-radius:4px;">Threat Intel: <strong style="color:#fff;">${ruleEval.moduleScores?.ioc || 0}</strong>/30đ</div>
                </div>

                ${ruleEval.isHardRule ? `
                    <div style="background:#ff475722; color:#ff4757; border:1px solid #ff475744; padding:6px 10px; border-radius:4px; font-size:10px; font-weight:bold; margin-top:4px;">
                        🚨 KÍCH HOẠT HARD RULE (100đ): ${escHtml(ruleEval.hardRuleHits?.join('; ') || '')}
                    </div>
                ` : ''}

                ${ruleEval.correlationBonuses && ruleEval.correlationBonuses.length > 0 ? `
                    <div style="background:#ffa50218; color:#ffa502; border:1px solid #ffa50244; padding:6px 10px; border-radius:4px; font-size:10px; margin-top:4px;">
                        ⭐ Điểm thưởng tương quan: ${ruleEval.correlationBonuses.map(b => `+${b.points}đ (${escHtml(b.rule)})`).join('; ')}
                    </div>
                ` : ''}
            </div>
            ` : ''}
        </div>
    `;
}

function openReportPDF(id) {
    window.open(`${API}/reports/${id}/html`, '_blank');
}

function scrollToSection(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Collect emails
async function collectEmails() {
    const btn = document.getElementById('btn-collect');
    btn.disabled = true;
    btn.textContent = 'Đang thu...';
    try {
        const res = await fetch(`${API}/inbox/collect`, { method: 'POST' });
        const data = await res.json();
        await loadEmails();
        btn.textContent = `✅ +${(data.data?.collected || []).length}`;
        setTimeout(() => { btn.textContent = 'Thu thập'; btn.disabled = false; }, 2000);
    } catch (err) {
        btn.textContent = '❌ Lỗi';
        setTimeout(() => { btn.textContent = 'Thu thập'; btn.disabled = false; }, 2000);
    }
}

// Helpers
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function riskColor(level) {
    if (level === 'MALICIOUS' || level === 'HIGH') return '#ff4757';
    if (level === 'SUSPICIOUS' || level === 'MEDIUM') return '#ffa502';
    if (level === 'LOW') return '#eccc68';
    if (level === 'CLEAN') return '#2ed573';
    if (level === 'INCONCLUSIVE') return '#70a1ff';
    return '#888';
}
function formatSize(bytes) { return bytes > 1024 ? (bytes / 1024).toFixed(1) + ' KB' : bytes + ' B'; }
function decodeSubject(s) {
    if (!s) return 'No Subject';
    // Decode simple Base64 encoded subjects
    const decoded = s.replace(/=\?UTF-8\?B\?([A-Za-z0-9+/=]+)\?=/gi, (_, b64) => {
        try { return atob(b64).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''); }
        catch(e) { return _; }
    });
    try { return decodeURIComponent(decoded).replace(/\r?\n\t?/g, ''); }
    catch(e) { return s.replace(/=\?UTF-8\?B\?[^?]+\?=/gi, '[Encoded]').replace(/\r?\n\t?/g, ''); }
}

// Init
loadEmails();
